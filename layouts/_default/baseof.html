<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · Vikingo Estudios{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.subtitle }}{{ end }}">
  <meta name="theme-color" content="#110e0c">
  <link rel="canonical" href="{{ .Permalink }}">

  <meta property="og:locale" content="es_AR">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Vikingo Estudios">
  <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · Vikingo Estudios{{ end }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.subtitle }}{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:image" content="{{ .Site.Params.heroImage | absURL }}">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/png" href="{{ "img/vikingo-logo-mini.png" | relURL }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </noscript>

  <style>
    :root{color-scheme:dark;--bg-deep:#110e0c;--text-primary:#f4ede2;--accent-amber:#e58d2e}
    html,body{margin:0;background:#110e0c;color:#f4ede2;font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,sans-serif}
  </style>

  {{- $css := resources.Get "css/site.css" | minify | fingerprint -}}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}" crossorigin="anonymous">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "name": "Vikingo Estudios",
    "alternateName": "Vikingo Estudio · De los siete mares",
    "description": {{ .Site.Params.subtitle | jsonify }},
    "foundingDate": "2009",
    "url": {{ .Site.BaseURL | jsonify }},
    "image": {{ (.Site.Params.heroImage | absURL) | jsonify }},
    "telephone": "+54-9-11-5491-3025",
    "email": "Vikingostudio@gmail.com",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Ciudad Evita",
      "addressRegion": "Provincia de Buenos Aires",
      "addressCountry": "AR"
    },
    "founder": {
      "@type": "Person",
      "name": "Claudio Vikingo Martorelli"
    }
  }
  </script>
</head>
<body>
  <a class="skip-link" href="#contenido-principal">Saltar al contenido principal</a>

  {{ partial "header.html" . }}

  <main id="contenido-principal">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}

  {{- $js := resources.Get "js/site.js" | minify | fingerprint -}}
  <script type="module" src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" crossorigin="anonymous"></script>
</body>
</html>
